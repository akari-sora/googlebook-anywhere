modprobe = []

# Speakers: lapis vendor_dlkm lib/modules/modules.blocklist is the one line "blocklist snd_hda_intel"
# (STOCK_MODULES_BLOCKLIST). kano (SOF) and generic-x86 boot that same partition, so it is not
# rewritten. unblock modprobes snd_hda_intel from /vendor/lib/modules without -b (ueventd's
# modprobe -b is what honors the file). This kernel has CONFIG_MODPROBE_PATH="", so
# request_module cannot pull a codec in. snd_hda_codec_alc269 is the shipped lapis module
# (install/probe/lapis-modules.tsv:5895; there is no snd_hda_codec_alc245 row). It is loaded
# before snd_hda_intel. ALC245 is the codec id the controller reports; the lapis set ships
# that family as snd_hda_codec_alc269. The alias column is "-" because gen-module-list KEEP
# does not record hdaudio: patterns.
# Bluetooth: bluetooth.ko is staged only under /vendor/lib/dev-modules; btusb.ko in vendor_dlkm
# depends on it and is modprobed after it, whether the bluetooth row is vendor or dev.
# Wi-Fi: AX210 is an mvm device. iwlmvm is in the shipped set (lapis-modules.tsv:2864).
# modprobe of an already-loaded iwlmvm succeeds. Names and order are the amd-hx370 rows of
# profiles/_safety.toml [modules]. Output is load, then unblock.
[modules]
unblock = ["snd_hda_intel"]
load = ["bluetooth", "btusb", "snd_hda_codec_alc269", "iwlmvm"]

[display]
stack = "native"
# Client composition until overlay planes are proven. vendor.py sets ro.hardware.egl=angle
# (GLES stays on the system ANGLE library; no radeonsi). ro.hardware.vulkan, ro.hwui.use_vulkan
# and debug.renderengine.vulkan are removed from build.prop and set on early-boot by
# /vendor/etc/amd-hx370-graphics.sh according to the chosen systemd-boot entry (safe vs native).
hwc_backend = "client"
build_prop_set = [["vendor.hwc.drm.enable_color_pipeline", "true", "false"],
                  ["vendor.hwc.drm.force_color_mode", "13", "0"],
                  ["vendor.hwc.drm.persistent_hdr", "true", "false"],
                  ["vendor.hwc.use_log_gamma_lut", "true", "false"],
                  ["ro.surface_flinger.has_wide_color_display", "true", "false"],
                  ["ro.surface_flinger.has_HDR_display", "true", "false"]]

[input]
kbd_backlight_leds = ""
power_button = "stock"

[hooks]
vendor = "vendor.py"

# One vendor allocator, loaded by both the safe entry and the native entry.
# tools/minigbm/build-libminigbm-gralloc.sh (Linux, NDK r30, git repo only) produces the file
# and exits unless the linked bytes match this sha256. The source pins that produced it
# are recorded next to LIB_SHA in that script. GBOS_MINIGBM must match this sha256 or the
# image build stops. The builder installs those verified
# bytes at lib64/libminigbm_gralloc.so, mode 0644, keeping the stock file_contexts. Profiles
# without this table (kano, generic-x86) do not replace the stock library.
[gralloc]
sha256 = "297457940c9090754e71d4027e157167825edab4139eb7d8828d1660b98e0d42"
