# Experimental profile: candidate full image passed QEMU checks; physical Ally remains unvalidated.
# SDHCI, UCSI and PMF dependencies are built but safety-blocked.
# WMI/Armoury and downstream Ally HID are blocked pending runtime/source safety remediation.
# modules.load/unblock remain empty: the immutable safety allowlist has no rog-ally rows.
# AVX-VNNI remediation is separate; patch_ifma alone does not make Zen 4 bootable.
# Round 2: Phoenix SMU 13.0.4 has no init_microcode callback; no separate smu_*.bin pin applies.
# The signed regulatory database is pinned below; wireless-regdb.toml records upstream signature provenance.
# Candidate image and QEMU boot checked; physical boot and hardware operation remain unverified.
schema = 1
kmods = ["gbos_efifb"]

[model]
id = "rog-ally"
name = "ASUS ROG Ally RC71L (kernel acceptance draft)"
status = "probe-only"              # verified | experimental | probe-only
image_name = "googlebook-rog-ally.img"
dmi = { sys_vendor = "ASUSTeK COMPUTER INC.", product_name = "ROG Ally RC71L_RC71L", board_name = "RC71L" }

[entries]                            # systemd-boot menu titles
quiet = "Googlebook ROG Ally safe"
debug = "Googlebook ROG Ally debug (no hardware validation)"

[cmdline]
stock_drop = ["snd_intel_sdw_acpi.sdw_link_mask=0x5", "xe.enable_psr=1", "snd_sof_pci.ipc_type=1"]
add = ["loglevel=8", "ignore_loglevel"]
tail = ["erst_disable"]
debug_drop = []
pci_stub_ids = []
first_stage_drop = []

[blacklist]
# the same EC/TPM/SPI/firmware-path list as the KANO profile: blacklisting a module a machine does not have costs nothing
modules = ["cros_ec_debugfs", "tpm_tis_i2c_cr50", "cros_ec_lpcs", "cros_ec_usb", "spi_intel_pci", "spi_intel", "i2c_dev",
           "thunderbolt", "tpm", "tpm_tis", "tpm_tis_core", "tpm_tis_spi", "cros_ec", "cros_ec_dev", "cros_ec_chardev",
           "gsmi", "chromeos_acpi", "nvram", "mtd", "spi_nor", "spidev", "intel_quicki2c", "intel_quickspi",
           "at24", "cros_hps_i2c", "i2c_cros_ec_tunnel", "cros_peripheral_charger",
           "cros_ec_spi", "cros_ec_i2c", "cros_ec_ishtp", "cros_ec_sysfs", "cros_ec_vbc", "cros_ec_typec", "cros_typec_switch",
           "cros_usbpd_notify", "cros_usbpd_charger", "cros_usbpd_logger", "cros_charge_control", "cros_ec_ucsi", "cros_ec_keyb",
           "cros_ec_sensorhub", "cros_ec_sensors_core", "cros_ec_sensors", "cros_ec_accel_legacy", "cros_ec_baro",
           "cros_ec_lid_angle", "cros_ec_light_prox", "cros_ec_lightbar", "cros_ec_pwrmon", "cros_ec_cec", "leds_cros_ec",
           "hid_google_hammer", "wilco_ec", "wilco_charger", "wilco_ec_debugfs", "wilco_ec_telem", "rtc_wilco_ec",
           "cros_ec_proto", "cros_kbd_led_backlight",
           "tpm_crb", "ccp", "ccp_crypto", "tee", "amdtee", "spi_amd", "spi_amd_pci", "spi_intel_platform", "intel_thc", "ee1004", "amd_sfh", "sp5100_tco", "sdhci_pci", "sdhci_acpi", "ucsi_acpi", "amd_pmf", "hid_asus_ally", "asus_armoury", "asus_wmi", "asus_nb_wmi", "amdgpu", "i2c_designware_platform"]
debug_add = []
quiet_add = []
allow = []

[firmware_sources]
linux_firmware_tag = "20260810"
sof_bin_url = ""
sof_bin_sha256 = ""
wireless_regdb_commit = "ea20dfa028cbb1b0e354efcdbcdbeec48308cb97"

[audio]
card = ""
config_dir = ""
sources = ""

[wifi]
modprobe = []

[modules]
unblock = []
load = []

[display]
stack = "gop-swiftshader"
# the GOP framebuffer device has one plane and no colour pipeline: SurfaceFlinger composes everything (client), and the
# drm_hwcomposer colour pipeline, HDR and log gamma LUT are off (the settings the QEMU proof ran with)
hwc_backend = "client"
build_prop_set = [["vendor.hwc.drm.enable_color_pipeline", "true", "false"],
                  ["vendor.hwc.drm.force_color_mode", "13", "0"],
                  ["vendor.hwc.drm.persistent_hdr", "true", "false"],
                  ["vendor.hwc.use_log_gamma_lut", "true", "false"],
                  ["ro.surface_flinger.has_wide_color_display", "true", "false"],
                  ["ro.surface_flinger.has_HDR_display", "true", "false"]]

[input]
kbd_backlight_leds = ""
power_button = "stock"

[cpu_compat]
patch_ifma = true
patch_ally_bootstrap = true            # four exact initrd members only, not whole-image ISA acceptance

[hooks]
vendor = "vendor.py"                  # display() only

