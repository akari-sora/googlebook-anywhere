# KANO: Acer Chromebook Spin 714 (CP714-1WN / CP714-2WN, Alder Lake-P/U & Raptor Lake-P/U, brya/kano) with MrChromebox UEFI firmware.
# Every model-specific value the builder uses (builder/lib/devprofile.py checks this file against profiles/_safety.toml).
# A new model is a new directory next to this one: docs/NEW-DEVICE.md, and install/gbos-probe.sh writes a draft.
schema = 1
# extra kernel modules built from pinned sources (builder/kmod/build-<name>.sh) and shipped in vendor:
# ac = the ACPI AC adapter driver (ACPI0003 _PSR), so Android shows the charger; it sends no EC host command
# gbos_wakefilter = drops the ACPI power button's resume KEY_WAKEUP when the button did not wake the system: without it
#   every dark resume (an RTC alarm, an EC event) turns the screen on, so a closed KANO lights up within a minute
kmods = ["ac", "gbos_wakefilter"]

[model]
id = "kano"
name = "Acer Chromebook Spin 714 (CP714-1WN / CP714-2WN)"
status = "verified"                  # verified | experimental | probe-only
# "verified" is the 46a6 Alder Lake-P K0 engineering sample only. Other KANO SKUs are untested
# (docs/STATUS-KANO.md). image.py warns when status is not verified, so this stays verified for that sample.
image_name = "googlebook-kano.img"
dmi = { sys_vendor = "Google", product_name = "Kano" }

[entries]                            # systemd-boot menu titles
quiet = "Googlebook KANO quiet"
debug = "Googlebook KANO safe serial-debug"

[cmdline]
# stock lapis options removed for this model (superseded by the tail below, or a lapis SoundWire mask the KANO lacks)
stock_drop = ["snd_intel_sdw_acpi.sdw_link_mask=0x5", "xe.enable_psr=1", "snd_sof_pci.ipc_type=1"]
# appended to the stock options of every entry; the quiet entry drops the console/earlycon/log-level ones again.
# Serial-debug keeps earlycon (MMIO 0xfe03e000, Cr50 AP UART) plus keep_bootcon, which devprofile.make_entries adds
# on the debug entry only. That is printk on the bootconsole, not a login tty. The three console= tokens
# (ttyS0, ttyS4, uart8250 mmio) stay off: CONFIG_SERIAL_8250_RUNTIME_UARTS=0, debug drops 8250.nr_uarts=4, and
# pci-stub holds 8086:51a8, so they never register a tty. Putting them back also exceeds the bootloader budget
# (COMMAND_LINE_SIZE 2048 - NUL - len(CONFIG_CMDLINE) - the setup.c separator space, minus 64 bytes for kano-boot.sh).
# xe.force_probe: 46a6 first, no '*'. 7 ids map to retail KANO SKUs; 5 are platform candidates
# (ADL-P/RPL-U macro members), KANO mapping unconfirmed — see docs/COMPATIBILITY.md.
# The retail mapping is the one written in docs/STATUS-KANO.md and docs/COMPATIBILITY.md
# (Acer retail model numbers and coreboot's KANO list). Each id is inside adl_p_desc
# (xe_pci.c:366-369 binds INTEL_ADLP_IDS, INTEL_RPLU_IDS and INTEL_RPLP_IDS; require_force_probe;
# pciids.h #define lines 669-687, 709-714, 717-722):
#   46a6  retail KANO SKU: verified i7-1260P (CBI SKU 131073); also coreboot-listed i5-1240P and i7-1280P
#   46a3  platform candidate (ADL-P/RPL-U macro member); KANO mapping unconfirmed
#   46a8  retail KANO SKU: i5-1235U and coreboot-listed i7-1255U
#   4626  retail KANO SKU: 1-channel memory variant of 46a6
#   4628  retail KANO SKU: 1-channel memory variant of 46a8
#   46b2  platform candidate (ADL-P/RPL-U macro member); KANO mapping unconfirmed
#   46b3  retail KANO SKU: i3-1215U
#   a721  platform candidate (ADL-P/RPL-U macro member); KANO mapping unconfirmed; INTEL_RPLU_IDS, not INTEL_RPLP_IDS
#   a7a1  retail KANO SKU: i5-1335U / i7-1355U
#   a7a9  retail KANO SKU: i3-1315U
#   a7ac  platform candidate (ADL-P/RPL-U macro member); KANO mapping unconfirmed
#   a7ad  platform candidate (ADL-P/RPL-U macro member); KANO mapping unconfirmed
# Omitted: ADL-N, RPL-S, RPL-P (a720, a7a0, a7a8, a7aa, a7ab) and ADLP IDs with no KANO SKU row (46a0-46a2, 46aa,
# 462a, 46b0, 46b1, 46c0-46c3). 46aa is not the i7-1280P ID; that part is 46a6 or 1-channel 4626.
add = ["loglevel=8", "ignore_loglevel", "earlycon=uart8250,mmio32,0xfe03e000,115200n8",
       "xe.force_probe=46a6,46a3,46a8,4626,4628,46b2,46b3,a721,a7a1,a7a9,a7ac,a7ad"]
# after the safety tail: xe on 6.18.21 faults scanning tiled framebuffers through a DPT in stolen memory
# (CVE-2026-80915, upstream fc648757908304aedbad74f74bf58192aec383db); max98373 + nau8825 on SOF ships for IPC3 only
tail = ["xe.enable_dpt=0", "xe.enable_psr=0", "xe.enable_fbc=0", "snd_sof_pci.ipc_type=0"]
debug_drop = ["8250.nr_uarts=4"]
# serial-debug and quiet: LPSS UART 00:1e.0 (51a8-51aa) and the fingerprint GSPI (51ab) go to pci-stub, so
# intel-lpss-pci binds only the I2C functions (touchpad, touchscreen, audio amplifiers)
pci_stub_ids = ["8086:51a8", "8086:51a9", "8086:51aa", "8086:51ab"]
# first-stage modules.load: pci-stub loads first, these never (they would claim the LPSS UART before pci-stub)
first_stage_drop = ["8250_dw.ko", "intel-lpss-pci.ko", "intel-lpss.ko"]

[blacklist]
# module_blacklist of every entry, in this order. With LPSS I2C live: EEPROM writer, HPS, EC I2C tunnel and peripheral
# charger stay unbound. cros_ec_proto (library only) is allowed so cros_kbd_led_backlight binds ACPI GOOG0002; every
# other module that depends on it stays out, transports first (no EC device is ever registered, so no EC host command
# can be sent).
modules = ["cros_ec_debugfs", "tpm_tis_i2c_cr50", "cros_ec_lpcs", "cros_ec_usb", "spi_intel_pci", "spi_intel", "i2c_dev",
           "thunderbolt", "tpm", "tpm_tis", "tpm_tis_core", "tpm_tis_spi", "cros_ec", "cros_ec_dev", "cros_ec_chardev",
           "gsmi", "chromeos_acpi", "nvram", "mtd", "spi_nor", "spidev", "intel_quicki2c", "intel_quickspi",
           "at24", "cros_hps_i2c", "i2c_cros_ec_tunnel", "cros_peripheral_charger",
           "cros_ec_spi", "cros_ec_i2c", "cros_ec_ishtp", "cros_ec_sysfs", "cros_ec_vbc", "cros_ec_typec", "cros_typec_switch",
           "cros_usbpd_notify", "cros_usbpd_charger", "cros_usbpd_logger", "cros_charge_control", "cros_ec_ucsi", "cros_ec_keyb",
           "cros_ec_sensorhub", "cros_ec_sensors_core", "cros_ec_sensors", "cros_ec_accel_legacy", "cros_ec_baro",
           "cros_ec_lid_angle", "cros_ec_light_prox", "cros_ec_lightbar", "cros_ec_pwrmon", "cros_ec_cec", "leds_cros_ec",
           "hid_google_hammer", "wilco_ec", "wilco_charger", "wilco_ec_debugfs", "wilco_ec_telem", "rtc_wilco_ec"]
# serial-debug and quiet also keep the LPSS UART drivers away (pci-stub holds 00:1e.0)
debug_add = ["8250_dw", "intel_lpss_acpi"]
# must stay loadable (keyboard backlight)
allow = ["cros_ec_proto", "cros_kbd_led_backlight"]

[firmware_sources]
linux_firmware_tag = "20260810"
sof_bin_url = "https://github.com/thesofproject/sof-bin/releases/download/v2025.12.2/sof-bin-2025.12.2.tar.gz"
sof_bin_sha256 = "533f63e3a6d94c09ce05a782657b675fa683ff20787c0979226cf563ec79f517"

# Device firmware, RAM-loaded by the drivers (nothing is flashed). path = under /vendor/firmware and under GBOS_FIRMWARE;
# src = path in linux-firmware (at linux_firmware_tag) or in the sof-bin tarball. Other versions were never tested on
# the KANO, so builder/vendor.sh refuses them unless GBOS_ALLOW_FIRMWARE_DRIFT=1.
[[firmware]]                         # ADL-P display microcontroller, GuC, HuC (xe)
path = "i915/adlp_dmc.bin"
from = "linux-firmware"
src = "i915/adlp_dmc.bin"
sha256 = "3516de2e134ddcf3b319c75d2e437779fecbd58cbb77234bd6f297c544e92ccb"
[[firmware]]
path = "i915/adlp_guc_70.bin"
