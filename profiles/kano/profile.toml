[[firmware]]                         # same bytes as the ADL tplg. SOF v2.2.13 rpl.m4 includes adl.m4 (sof-bin
path = "intel/sof-tplg/sof-rpl-max98373-nau8825.tplg"  # v2025.12.2 has no RPL-named file). Untested on 13th-gen hardware.
from = "sof-bin"
src = "sof-bin-2025.12.2/sof-tplg/sof-adl-max98373-nau8825.tplg"
sha256 = "4beb29400d9beed0c80bcc11b3f4e82aad70a54d6e851638c81eb087a10d4de5"

[audio]
# card sof-nau8825 (NAU8825 headset + 2x MAX98373, SOF IPC3); the DRAS files are written by hooks.vendor (audio())
card = "sof-nau8825"
config_dir = "sof-nau8825_kano"
sources = "audio-src.list"           # ChromeOS board-overlays files, fetched by builder/fetch-inputs.sh

[wifi]
modprobe = ["iwlmvm"]                # the AX211 needs the iwlmvm op-mode (lapis only loads iwlmld, for BE200/BE211)

[display]
stack = "native"                     # native | gop-swiftshader (builder/lib/devprofile.py)
hwc_backend = "client"               # xe faults scanning Y-tiled buffers through DPT on ADL-P: SurfaceFlinger composes all
# drm_hwcomposer colour pipeline, HDR and log gamma LUT off; SurfaceFlinger treats the panel as sRGB SDR
build_prop_set = [["vendor.hwc.drm.enable_color_pipeline", "true", "false"],
                  ["vendor.hwc.drm.force_color_mode", "13", "0"],
                  ["vendor.hwc.drm.persistent_hdr", "true", "false"],
                  ["vendor.hwc.use_log_gamma_lut", "true", "false"],
                  ["ro.surface_flinger.has_wide_color_display", "true", "false"],
                  ["ro.surface_flinger.has_HDR_display", "true", "false"]]

[input]
# ACPI GOOG0002 (\_SB_.CREC.KBLT) sits under the EC node here, so cros_kbd_led_backlight registers below GOOG0004
kbd_backlight_leds = "/sys/devices/platform/GOOG0004:00/GOOG0002:00/leds"
power_button = "acpi"                # cros_ec_keyb is blacklisted: the ACPI Power Button is the only power key

[camera]
# The built-in camera (IPU6 + OV2740; the kernel side is in lapis' vendor_dlkm): upstream libcamera 0.7.2 (simple
# pipeline, SoftISP on the CPU) and its Android camera3 HAL, built by builder/camera/build-libcamera.sh and added by
# vendor.py camera(). false until it is proven on the KANO's Android: only a build with GBOS_CAMERA_OVERLAY=<its
# out/vendor> includes it. true = every build needs that overlay.
libcamera = false

[hooks]
vendor = "vendor.py"                 # model-specific vendor edits that need more than data (comments, DRAS files)
