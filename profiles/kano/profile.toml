[[firmware]]                         # RPL cAVS (CP714-2WN, 8086:51ca/51cb) requests community/sof-rpl.ri. In sof-bin
path = "intel/sof/community/sof-rpl.ri"  # v2025.12.2 that member is a symlink to sof-tgl.ri; pin the regular file.
from = "sof-bin"
